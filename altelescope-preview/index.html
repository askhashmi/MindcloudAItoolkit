<style>
/* Layout: editorial stack of full-width bands (white / black / orange), 1200px inner column, big condensed headlines, hash-routed views: home, creator-*, admin */
:root{
  --bg:#ffffff; --fg:#0b0b0b; --muted:#5f5a55; --line:#e6e1dc; --soft:#f5f2ef;
  --ink:#0b0b0b; --on-ink:#ffffff; --accent:#ff5a1f; --on-accent:#0b0b0b;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0d0c; --fg:#f4f1ee; --muted:#a69f98; --line:#2a2725; --soft:#181614;
  --ink:#000000; --on-ink:#ffffff; --accent:#ff6a33; --on-accent:#0b0b0b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0d0c; --fg:#f4f1ee; --muted:#a69f98; --line:#2a2725; --soft:#181614;
  --ink:#000000; --on-ink:#ffffff; --accent:#ff6a33; --on-accent:#0b0b0b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);margin:0}
html[dir="rtl"] body{font-family:var(--ar)}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .logo{font-family:var(--ar);letter-spacing:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:88px}
.band.ink{background:var(--ink);color:var(--on-ink)}
.band.ink .muted{color:#b9b2ab}
.band.orange{background:var(--accent);color:var(--on-accent)}
.band.soft{background:var(--soft)}
h1,h2,h3{font-family:var(--display);line-height:1;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(3rem,9vw,7.5rem);font-weight:900;text-transform:uppercase;letter-spacing:-.035em}
h2{font-size:clamp(2.1rem,5vw,3.8rem);font-weight:900;text-transform:uppercase}
h3{font-size:1.35rem;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font:500 .75rem/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);display:block;margin-bottom:18px}
.band.orange .eyebrow{color:var(--on-accent)}
.lead{font-size:1.2rem;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;font:700 .95rem/1 var(--body);padding:16px 26px;border-radius:999px;border:2px solid currentColor;background:transparent;color:inherit;text-decoration:none;cursor:pointer}
html[dir="rtl"] .btn{font-family:var(--ar)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{font:900 1.35rem/1 var(--display);text-decoration:none;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--accent);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
nav.main{display:flex;gap:22px;font-weight:600;font-size:.92rem}
nav.main a{text-decoration:none}
nav.main a:hover{color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.chip{font:600 .8rem/1 var(--body);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none}
html[dir="rtl"] .chip{font-family:var(--ar)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (max-width:900px){nav.main{display:none}}

/* hero */
.hero{padding-block:72px 56px}
.hero h1 span{color:var(--accent)}
.hero .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:end;margin-top:40px}
.scope{aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--accent) 0 18%,transparent 18.5%),repeating-radial-gradient(circle at 50% 50%,var(--fg) 0 1px,transparent 1px 34px);opacity:.95;position:relative}
.scope::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px;border-top:2px solid var(--fg);padding-top:24px}
.stats b{font:900 2.4rem/1 var(--display);display:block;font-variant-numeric:tabular-nums}
@media (max-width:800px){.hero .grid{grid-template-columns:1fr}.scope{max-width:260px}.stats{grid-template-columns:1fr 1fr 1fr;gap:12px}.stats b{font-size:1.7rem}}

/* marquee of tracks */
.tracks{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.tracks span{font:800 1rem/1 var(--display);text-transform:uppercase;padding:12px 18px;border:2px solid currentColor;border-radius:999px}
html[dir="rtl"] .tracks span{font-family:var(--ar)}

/* cards */
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
@media (max-width:480px){.grid4{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:14px;min-width:0}
.thumb{aspect-ratio:4/3;border-radius:14px;background:var(--soft);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:16px}
.band.soft .thumb{background:var(--bg)}
.thumb.t1{background:var(--ink);color:var(--on-ink)}
.thumb.t2{background:var(--accent);color:var(--on-accent)}
.thumb .big{font:900 3.2rem/0.9 var(--display);text-transform:uppercase;letter-spacing:-.03em}
html[dir="rtl"] .thumb .big{font-family:var(--ar);font-size:2.4rem}
.tag{font:500 .7rem/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.price{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-weight:700;font-variant-numeric:tabular-nums}
.price a{color:var(--accent);text-decoration:none}

/* offer list (like a menu) */
.offers{border-top:2px solid currentColor}
.offer{display:grid;grid-template-columns:60px 1fr 1.2fr auto;gap:24px;align-items:center;padding-block:26px;border-bottom:1px solid rgba(255,255,255,.18);text-decoration:none}
.offer:hover h3{color:var(--accent)}
.offer .k{font:500 .8rem var(--mono);color:var(--accent)}
.offer h3{font-size:clamp(1.4rem,3vw,2.2rem);text-transform:uppercase;font-weight:900}
.offer .arrow{font-size:1.6rem}
html[dir="rtl"] .offer .arrow{transform:scaleX(-1)}
@media (max-width:760px){.offer{grid-template-columns:1fr auto}.offer .k,.offer p{display:none}}

/* featured course */
.feature{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.feature ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.feature li{display:flex;gap:12px}
.feature li::before{content:"";flex:none;width:10px;height:10px;margin-top:8px;background:var(--on-accent);border-radius:50%}
.frame{aspect-ratio:16/10;max-width:100%;background:var(--ink);color:var(--on-ink);border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative}
.play{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:1.8rem;color:var(--on-accent)}
@media (max-width:860px){.feature{grid-template-columns:1fr}}

/* creators */
.creator{text-decoration:none;display:flex;flex-direction:column;gap:12px}
.avatar{aspect-ratio:1;border-radius:16px;background:var(--soft);display:grid;place-items:center;font:900 3.5rem/1 var(--display);color:var(--fg);overflow:hidden;max-width:100%}
.creator:nth-child(3n+1) .avatar{background:var(--accent);color:var(--on-accent)}
.creator:nth-child(3n+2) .avatar{background:var(--ink);color:var(--on-ink)}
.creator:hover h3{color:var(--accent)}

/* episodes */
.ep{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding-block:18px;border-bottom:1px solid var(--line)}
.ep .n{font:500 .8rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ep .len{font:500 .8rem var(--mono);color:var(--muted)}

/* quotes */
blockquote{margin:0;font:600 1.2rem/1.45 var(--body)}
html[dir="rtl"] blockquote{font-family:var(--ar)}
.quote{display:flex;flex-direction:column;gap:18px;padding:28px;border:1px solid var(--line);border-radius:16px;min-width:0}
.quote cite{font-style:normal;font-size:.9rem;color:var(--muted)}

/* newsletter */
.news{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
form.sub{display:flex;gap:10px;flex-wrap:wrap}
form.sub input{flex:1 1 220px;min-width:0;padding:16px 20px;border-radius:999px;border:2px solid var(--on-accent);background:transparent;color:var(--on-accent);font:500 1rem var(--body)}
form.sub input::placeholder{color:var(--on-accent);opacity:.65}
.ok{font-weight:700;margin-top:12px}
@media (max-width:860px){.news{grid-template-columns:1fr}}

/* footer */
footer{background:var(--ink);color:var(--on-ink);padding-block:64px 32px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
footer h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.12em;color:#b9b2ab;margin:0 0 14px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a{text-decoration:none}
footer a:hover{color:var(--accent)}
footer .giant{font:900 clamp(3rem,12vw,10rem)/.85 var(--display);letter-spacing:-.05em;margin-top:56px;color:var(--accent);overflow-wrap:anywhere}
@media (max-width:760px){footer .cols{grid-template-columns:1fr 1fr}}

/* creator profile */
.crumb{font:500 .8rem var(--mono);text-transform:uppercase;letter-spacing:.1em;text-decoration:none;color:var(--muted)}
.prof{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:end;margin-top:28px}
.prof .avatar{font-size:6rem}
.socials{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:800px){.prof{grid-template-columns:1fr}.prof .avatar{max-width:220px}}

/* admin */
.admin{display:grid;grid-template-columns:240px 1fr;gap:32px;padding-block:40px 80px}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:90px;align-self:start}
.side button{text-align:start;padding:12px 14px;border-radius:10px;border:0;background:transparent;color:var(--fg);font:600 .95rem var(--body);cursor:pointer}
html[dir="rtl"] .side button{font-family:var(--ar)}
.side button.on{background:var(--fg);color:var(--bg)}
.panel{border:1px solid var(--line);border-radius:16px;padding:28px;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fields .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
input,textarea,select{font:400 .95rem var(--body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
html[dir="rtl"] input,html[dir="rtl"] textarea{font-family:var(--ar)}
textarea{min-height:90px;resize:vertical}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr 1fr 110px 40px;gap:10px;align-items:center}
.x{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;height:44px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:start;padding:12px 10px;border-bottom:1px solid var(--line)}
.tbl th{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.pill{font:600 .72rem var(--body);padding:4px 10px;border-radius:999px;background:var(--soft)}
.pill.live{background:var(--accent);color:var(--on-accent)}
.scroll{overflow-x:auto}
.note{font-size:.85rem;color:var(--muted);border-inline-start:3px solid var(--accent);padding-inline-start:12px}
@media (max-width:860px){.admin{grid-template-columns:1fr}.side{position:static;flex-direction:row;flex-wrap:wrap}.fields{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item .x{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn:hover{transform:none}}
</style>

function wireAdmin(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{admTab=+b.dataset.tab;render();});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{saveExtra(extras().filter(e=>e.id!==b.dataset.del));render();});
  const f=document.getElementById("cForm"); if(!f) return;
  addItemRow(); addEpRow();
  document.getElementById("addItem").onclick=addItemRow;
  document.getElementById("addEp").onclick=addEpRow;
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const v=id=>document.getElementById(id).value.trim();
    const name=v("f-name");
    const id=name.toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g,"-").replace(/^-|-$/g,"")||("creator-"+Date.now());
    const rows=sel=>[...document.querySelectorAll(sel+" .item")].map(r=>{const o={};r.querySelectorAll("[data-k]").forEach(i=>o[i.dataset.k]=i.value.trim());return o;});
    const c={id,name,ini:(v("f-ini")||name.split(/\s+/).map(w=>w[0]).join("").slice(0,2)).toUpperCase(),role:v("f-role"),track:v("f-track"),
      bio:v("f-bio")||"Bio coming soon.",social:v("f-social"),
      items:rows("#itemList").filter(i=>i.t).map(i=>({...i,price:i.price||"0"})),
      eps:rows("#epList").filter(i=>i.t)};
    const list=extras().filter(x=>x.id!==id); list.push(c); saveExtra(list);
    const m=document.getElementById("savedMsg"); m.hidden=false;
    m.innerHTML=`${T[lang].adm.saved} <a href="#creator-${esc(id)}">#creator-${esc(id)}</a>`;
  });
}

/* ---------- chrome + router ---------- */
function chrome(){
  const t=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  const anchors=["courses","home","home","shop","podcast","creators","membership"];
  document.getElementById("nav").innerHTML=t.nav.map((x,i)=>`<a href="#${anchors[i]}">${x}</a>`).join("");
  document.getElementById("langBtn").textContent=t.lang;
  document.getElementById("adminBtn").textContent=t.admin;
  document.getElementById("foot").innerHTML=`<div class="stack" style="gap:12px"><span class="logo"><i></i>AlTelescope</span><p style="color:#b9b2ab;max-width:32ch">${t.footLead}</p></div>`+
    t.foot.map(c=>`<div><h4>${c[0]}</h4><ul>${c[1].map(x=>`<li><a href="#home">${x}</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("copy").textContent=t.copy;
}
const SECTIONS=["courses","shop","creators","podcast","membership"];
function render(){
  chrome();
  const h=(location.hash||"#home").slice(1);
  const app=document.getElementById("app");
  document.getElementById("adminBtn").classList.toggle("on",h==="admin");
  if(h==="admin"){ app.innerHTML=viewAdmin(); wireAdmin(); window.scrollTo(0,0); return; }
  if(h.startsWith("creator-")){ app.innerHTML=viewCreator(h.slice(8)); wireNews(); window.scrollTo(0,0); return; }
  app.innerHTML=viewHome(); wireNews();
  if(SECTIONS.includes(h)){ const el=document.getElementById(h); if(el) el.scrollIntoView(); } else window.scrollTo(0,0);
}
document.getElementById("langBtn").onclick=()=>{ lang=lang==="en"?"ar":"en"; try{localStorage.setItem("at-lang",lang);}catch(e){} render(); };
window.addEventListener("hashchange",render);
render();
</script>
